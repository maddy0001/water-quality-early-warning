# Segment 5 – fusion of the paper-1 modules and calibration under a false-alarm budget
# (contributions C4, C5; experiments E4, E5, E6). Runs on the GECCO-Triage stream of S4.
#   python -m ewsv2 fuse --config s5_fusion
#   python -m ewsv2 fuse --config s5_fusion --set data.source=gecco2019
extends: s4_triage
run_name: s5_fusion
title: Fusion and calibration

fuse:
  splitter: {name: official, params: {cv_folds: 4, gap_minutes: 1440}}
  tolerance_after: 0
  merge_gap: 5
  max_episode_minutes: 60
  fault_grace: 10
  budget: 1.0                 # target: false water alarms per day
  modules:                    # paper 1's three modules, on one stream
    - {role: C, name: v1_ensemble, part: ensemble}                                         # classifier (S2)
    - {role: A, name: v1_quorum, part: quorum}                                             # anomaly quorum (S2)
    - {role: F, name: forecast_linear, part: surprise_mean, params: {lookback: 30, horizon: 5}}   # forecast surprise (S3)
  fusions:
    - {name: single, params: {role: C}}
    - {name: single, params: {role: A}}
    - {name: single, params: {role: F}}
    - hand                    # paper 1: 0.40 C + 0.30 F + 0.30 A
    - equal
    - max
    - stacking                # learned weights
  calibrators:
    - cv_f1                   # S1 rule: best pre-test F1
    - budget                  # fixed threshold, budget on pre-test water
    - adaptive                # corrects itself online from the operator's verdicts
  persistence: [[1, 1], [2, 3], [3, 5]]
  main: {fusion: auto, calibrator: adaptive}
  rules: {}                   # S4 rules triage settings, e.g. {jump_units: 8.0}   # auto = best pre-test F1 at the budget
